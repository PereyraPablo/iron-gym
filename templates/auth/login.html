

{% extends "base.html" %}

{% block titulo %}Iniciar sesión | Iron Gym{% endblock %}

{% block estilos %}
<style>
    /* Contenedor principal de la pantalla de acceso */
    .login-seccion {
        min-height: 65vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 60px 20px;
    }

    /* Tarjeta del formulario */
    .login-tarjeta {
        width: 100%;
        max-width: 440px;
        background-color: var(--color-superficie);
        border: 1px solid var(--color-borde);
        border-radius: 8px;
        padding: 40px;
    }

    .login-titulo {
        text-align: center;
        margin-bottom: 10px;
        font-size: 28px;
        font-weight: 800;
    }

    .login-subtitulo {
        text-align: center;
        color: var(--color-texto-secundario);
        margin-bottom: 30px;
        font-size: 14px;
    }

    .login-grupo {
        margin-bottom: 20px;
    }

    .login-grupo label {
        display: block;
        margin-bottom: 9px;
        font-weight: 700;
        font-size: 14px;
    }

    .login-grupo input {
        width: 100%;
        padding: 13px;
        background-color: #111111;
        color: var(--color-texto);
        border: 1px solid var(--color-borde);
        border-radius: 4px;
        font-size: 14px;
    }

    .login-grupo input:focus {
        outline: none;
        border-color: var(--color-principal);
    }

    .login-boton {
        width: 100%;
        padding: 14px;
        margin-top: 10px;
        background-color: var(--color-principal);
        color: #111111;
        border: none;
        border-radius: 4px;
        font-size: 15px;
        font-weight: 800;
        cursor: pointer;
        transition: background-color 0.3s ease;
    }

    .login-boton:hover {
        background-color: var(--color-principal-hover);
    }

    .login-volver {
        display: block;
        text-align: center;
        margin-top: 25px;
        color: var(--color-texto-secundario);
        font-size: 13px;
        text-decoration: none;
    }

    .login-volver:hover {
        color: var(--color-principal);
    }

    /* Adaptación para pantallas pequeñas */
    @media (max-width: 480px) {
        .login-tarjeta {
            padding: 28px 22px;
        }

        .login-titulo {
            font-size: 24px;
        }
    }
</style>
{% endblock %}


{% block navegacion %}

<nav class="navegacion">
    <a href="{{ url_for('inicio') }}">Inicio</a>
    <a href="{{ url_for('maquinas.catalogo') }}">Máquinas</a>
</nav>

{% endblock %}


{% block contenido %}

<section class="login-seccion">

    <div class="login-tarjeta">

        <h1 class="login-titulo">
            Iniciar sesión
        </h1>

        <p class="login-subtitulo">
            Ingresá a tu cuenta de Iron Gym.
        </p>

        <!-- Formulario que envía las credenciales al controlador -->
        <form method="POST" action="{{ url_for('auth.login') }}">

            <div class="login-grupo">

                <label for="email">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="ejemplo@correo.com"
                    autocomplete="username"
                    required
                >

            </div>

            <div class="login-grupo">

                <label for="password">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Ingresá tu contraseña"
                    autocomplete="current-password"
                    required
                >

            </div>

            <button type="submit" class="login-boton">
                INGRESAR
            </button>

        </form>

        <a href="{{ url_for('inicio') }}" class="login-volver">
            Volver al inicio
        </a>

    </div>

</section>

{% endblock %}
